<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Flash-prevention base styles. Theme tokens live in app.css; redefining
         them here would override its layered dark palette. -->
    <style>
      body {
        background-color: var(--color-primary);
        color: var(--color-text);
        font-family: 'Courier New', Courier, monospace;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
    </style>

    <!-- Everyone starts on System until an authenticated database preference loads. -->
    <script>
      (function () {
        var resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
