<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Flash-prevention base styles. Deliberately does NOT redefine the color
         custom properties: those live in app.css (light :root + dark
         html[data-theme='dark']) so the persisted theme wins the cascade.
         Defining them here unlayered would override app.css's layered dark
         palette and pin the page to light. -->
    <style>
      body {
        background-color: var(--color-primary);
        color: var(--color-text);
        font-family: 'Courier New', Courier, monospace;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
    </style>

    <!-- Resolve the local preference synchronously before first paint. -->
    <script>
      (function () {
        var preference = 'system';
        try {
          var stored = localStorage.getItem('gitgud-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
        } catch (e) {
          preference = 'system';
        }
        var resolved =
          preference === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
